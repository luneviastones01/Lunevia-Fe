<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#0d0c0a"/>
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d0c0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="180" r="140" fill="url(#goldGlow)"/>

  <!-- Stylized gemstone / crystal specimen wireframe -->
  <g stroke="#d4af37" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.85">
    <polygon points="200,95 245,135 200,155 155,135" fill="#d4af37" fill-opacity="0.08"/>
    <polygon points="155,135 200,95 125,145" fill="#d4af37" fill-opacity="0.04"/>
    <polygon points="245,135 200,95 275,145" fill="#d4af37" fill-opacity="0.12"/>
    <polygon points="125,145 155,135 200,155 245,135 275,145 200,245" fill="#d4af37" fill-opacity="0.06"/>
    <line x1="155" y1="135" x2="200" y2="245"/>
    <line x1="200" y1="155" x2="200" y2="245"/>
    <line x1="245" y1="135" x2="200" y2="245"/>
  </g>

  <!-- Luxury Typography -->
  <text x="203" y="295" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" fill="#e6ca65" letter-spacing="6" text-anchor="middle" font-weight="400">LUNÉVIA</text>
  <text x="201" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8c8273" letter-spacing="3" text-anchor="middle">SPECIMEN ARCHIVE</text>
</svg>
